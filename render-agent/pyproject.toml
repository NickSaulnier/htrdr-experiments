[project]
name = "htrdr-agent"
version = "0.1.0"
description = "MCP tools and an agent that drive htrdr renders to a target uncertainty"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
]

[project.scripts]
fake-htrdr = "htrdr_agent.fake:main"
htrdr-mcp = "htrdr_agent.server:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["htrdr: needs the real htrdr-atmosphere (skipped when it isn't installed)"]
